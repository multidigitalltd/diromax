# Continuous integration — standard section 10.3.
# Every job must pass before a pull request can merge.
# Actions are pinned to commit SHAs (standard 4.12.4).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Daily dependency audit of the default branch (standard 4.12.5).
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: Lint, static analysis, tests
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0.40
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wp_tests
          MYSQL_USER: wp
          MYSQL_PASSWORD: wp
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '8.3'
          extensions: sodium, intl, mysqli, fileinfo, gd
          coverage: pcov
          tools: composer:v2

      - name: Install from the lock file
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Dependency audit
        run: composer audit --locked

      - name: Coding standards (PHPCS, WordPress-Extra/Docs, PHPCompatibilityWP)
        run: composer lint

      - name: Static analysis (PHPStan level 8)
        run: composer analyse

      - name: Unit and integration tests
        env:
          WP_TESTS_DB_HOST: 127.0.0.1
          WP_TESTS_DB_NAME: wp_tests
          WP_TESTS_DB_USER: wp
          WP_TESTS_DB_PASSWORD: wp
        run: vendor/bin/phpunit --coverage-text --colors=never

      - name: Minified assets are up to date
        run: |
          php bin/build-assets.php
          git diff --exit-code -- '*.min.css' '*.min.js'

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@eafb8c5f6a06175141c27f17bcc17941853d0047 # v3.90.0
        with:
          # The action already passes --fail; the image is pinned to the same release.
          version: 3.90.0
          extra_args: --results=verified,unknown

  sast:
    name: Static application security testing
    runs-on: ubuntu-24.04
    container:
      image: semgrep/semgrep:1.131.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Semgrep (PHP and OWASP Top 10 rules)
        run: semgrep scan --config p/php --config p/owasp-top-ten --error --metrics=off --exclude vendor --exclude docs

  e2e:
    name: End-to-end (Chromium + axe)
    runs-on: ubuntu-24.04
    needs: php
    services:
      mysql:
        image: mysql:8.0.40
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wp_e2e
          MYSQL_USER: wp
          MYSQL_PASSWORD: wp
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '8.3'
          extensions: sodium, intl, mysqli, fileinfo, gd
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install from the lock files
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          cd diromax-portal/tests/e2e
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Throwaway WordPress with the worked example
        env:
          DX_E2E_DB_HOST: 127.0.0.1
        run: bash diromax-portal/tests/e2e/setup.sh "$RUNNER_TEMP/e2e"

      - name: Client journey
        working-directory: diromax-portal/tests/e2e
        run: node client.e2e.js "$RUNNER_TEMP/e2e"

      - name: Project manager journey
        working-directory: diromax-portal/tests/e2e
        run: node manager.e2e.js "$RUNNER_TEMP/e2e"

      - name: Phase 2 journey (dashboard, decisions, reminders, CSV, password)
        working-directory: diromax-portal/tests/e2e
        run: node phase2.e2e.js "$RUNNER_TEMP/e2e"

      - name: Theme web defaults (privacy notice, footer, leads CRM)
        working-directory: diromax-portal/tests/e2e
        run: node theme.e2e.js "$RUNNER_TEMP/e2e"
      - name: Management app on the site (/portal/manage/)
        working-directory: diromax-portal/tests/e2e
        run: node manage.e2e.js "$RUNNER_TEMP/e2e"
      - name: Release 1.6.0 - due dates, tasks, uploads, report and signatures
        working-directory: diromax-portal/tests/e2e
        run: node phase3.e2e.js "$RUNNER_TEMP/e2e"

      - name: Release 1.8.0 - photo journal and conversation
        working-directory: diromax-portal/tests/e2e
        run: node phase4.e2e.js "$RUNNER_TEMP/e2e"

      - name: Release 1.9.0 - budget tree, manager phone, case deletion
        working-directory: diromax-portal/tests/e2e
        run: node phase5.e2e.js "$RUNNER_TEMP/e2e"

      - name: Release 1.10.0 - meetings and payments forecast
        working-directory: diromax-portal/tests/e2e
        run: node phase6.e2e.js "$RUNNER_TEMP/e2e"

      - name: Release 1.11.0 - payment plan by stages
        working-directory: diromax-portal/tests/e2e
        run: node phase7.e2e.js "$RUNNER_TEMP/e2e"

      - name: Release 1.12.0 - client timeline
        working-directory: diromax-portal/tests/e2e
        run: node phase8.e2e.js "$RUNNER_TEMP/e2e"

      - name: Release 1.13.0 - site visits and findings
        working-directory: diromax-portal/tests/e2e
        run: node phase9.e2e.js "$RUNNER_TEMP/e2e"

      # Standard 9.1-9.2: Lighthouse on the key pages, phone and desktop. Over budget fails the job.
      - name: Performance budget (Lighthouse)
        working-directory: diromax-portal/tests/e2e
        run: node perf.e2e.js "$RUNNER_TEMP/e2e"

      - name: No PHP warnings or notices
        run: |
          if [ -f "$RUNNER_TEMP/e2e/debug.log" ] && grep -v '"source":"diromax-portal"' "$RUNNER_TEMP/e2e/debug.log"; then
            exit 1
          fi

      - name: Screenshots and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/e2e/e2e
          retention-days: 14
